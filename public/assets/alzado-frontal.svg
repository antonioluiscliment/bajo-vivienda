<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 820" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7F1E8"/>
      <stop offset="100%" stop-color="#EFE6D8"/>
    </linearGradient>
    <linearGradient id="pave" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#DCE6E8"/>
      <stop offset="100%" stop-color="#B9C9CD"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#CFE3EA" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#9FBBC4" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C9C2B6"/>
      <stop offset="100%" stop-color="#B4ACA0"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EFE9DC"/>
      <stop offset="100%" stop-color="#E4DCC9"/>
    </linearGradient>
    <linearGradient id="pier" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9C8B6F"/>
      <stop offset="100%" stop-color="#7C6D54"/>
    </linearGradient>
  </defs>

  <rect width="1050" height="820" fill="url(#bg)"/>

  <!-- Título -->
  <text x="60" y="45" font-size="21" font-weight="700" fill="#8A3B1E">Alzado Frontal — Frente de 5,40 m entre paredes</text>
  <text x="60" y="66" font-size="12.5" fill="#6B6459">Zona A (2,40 m): pavés + ventanas oscilobatientes, con machones de 20/30 cm · Zona B (3,00 m): acceso abatible provisional</text>

  <!-- Suelo -->
  <rect x="120" y="630" width="648" height="24" fill="url(#floor)"/>

  <!-- Marco estructural exterior (referencia) -->
  <rect x="120" y="150" width="648" height="480" fill="none" stroke="#C1622D" stroke-width="12"/>

  <!-- ============ ZONA A: 2,40 m (x=120 a x=408) ============ -->
  <!-- fondo pavés continuo de suelo a techo -->
  <rect x="120" y="150" width="288" height="480" fill="url(#pave)"/>
  <g stroke="#F7F1E8" stroke-width="2.5">
    <!-- líneas horizontales de junta cada ~40cm -->
    <line x1="120" y1="198" x2="408" y2="198"/>
    <line x1="120" y1="246" x2="408" y2="246"/>
    <line x1="120" y1="294" x2="408" y2="294"/>
    <line x1="120" y1="342" x2="408" y2="342"/>
    <line x1="120" y1="486" x2="408" y2="486"/>
    <line x1="120" y1="534" x2="408" y2="534"/>
    <line x1="120" y1="582" x2="408" y2="582"/>
  </g>

  <!-- Machón izquierdo (extremo) 0,25 m -->
  <rect x="120" y="150" width="30" height="480" fill="url(#pier)"/>
  <!-- Ventana 1 -->
  <rect x="150" y="342" width="99" height="144" fill="url(#glass)" stroke="#5B5B5B" stroke-width="4"/>
  <path d="M 160 355 L 195 414 L 160 473" fill="none" stroke="#7A7A7A" stroke-width="1.5"/>
  <path d="M 239 355 L 204 414 L 239 473" fill="none" stroke="#7A7A7A" stroke-width="1.5"/>
  <!-- Machón central 0,30 m -->
  <rect x="249" y="150" width="30" height="480" fill="url(#pier)"/>
  <!-- Ventana 2 -->
  <rect x="279" y="342" width="99" height="144" fill="url(#glass)" stroke="#5B5B5B" stroke-width="4"/>
  <path d="M 289 355 L 324 414 L 289 473" fill="none" stroke="#7A7A7A" stroke-width="1.5"/>
  <path d="M 368 355 L 333 414 L 368 473" fill="none" stroke="#7A7A7A" stroke-width="1.5"/>
  <!-- Machón derecho (extremo zona A) 0,30 m -->
  <rect x="378" y="150" width="30" height="480" fill="url(#pier)"/>

  <!-- ============ ZONA B: 3,00 m (x=408 a x=768) ============ -->
  <!-- Zona abierta superior (de 1,00 m a 4,00 m) -->
  <rect x="408" y="150" width="360" height="360" fill="url(#sky)" stroke="#D8CEB8" stroke-width="1" stroke-dasharray="6 5"/>
  <text x="588" y="330" font-size="12.5" fill="#9C9282" text-anchor="middle">Espacio abierto (cubierto) · sin cerrar</text>

  <!-- Dintel / línea de cierre a 1,00 m -->
  <line x1="408" y1="510" x2="768" y2="510" stroke="#7C6D54" stroke-width="5"/>

  <!-- Puerta abatible 1 (1,50 m) -->
  <rect x="408" y="510" width="180" height="120" fill="#EDE9E2" stroke="#5B5B5B" stroke-width="3"/>
  <g stroke="#4A4A4A" stroke-width="4">
    <line x1="420" y1="510" x2="420" y2="630"/>
    <line x1="440" y1="510" x2="440" y2="630"/>
    <line x1="460" y1="510" x2="460" y2="630"/>
    <line x1="480" y1="510" x2="480" y2="630"/>
    <line x1="500" y1="510" x2="500" y2="630"/>
    <line x1="520" y1="510" x2="520" y2="630"/>
    <line x1="540" y1="510" x2="540" y2="630"/>
    <line x1="560" y1="510" x2="560" y2="630"/>
    <line x1="580" y1="510" x2="580" y2="630"/>
  </g>
  <!-- flecha de apertura hacia adentro -->
  <path d="M 408 620 A 180 180 0 0 0 578 630" fill="none" stroke="#9C9282" stroke-width="1.3" stroke-dasharray="4 4"/>
  <path d="M 560 617 l 18 13 l -22 4 z" fill="#9C9282"/>

  <!-- Puerta abatible 2 (1,50 m) -->
  <rect x="588" y="510" width="180" height="120" fill="#EDE9E2" stroke="#5B5B5B" stroke-width="3"/>
  <g stroke="#4A4A4A" stroke-width="4">
    <line x1="600" y1="510" x2="600" y2="630"/>
    <line x1="620" y1="510" x2="620" y2="630"/>
    <line x1="640" y1="510" x2="640" y2="630"/>
    <line x1="660" y1="510" x2="660" y2="630"/>
    <line x1="680" y1="510" x2="680" y2="630"/>
    <line x1="700" y1="510" x2="700" y2="630"/>
    <line x1="720" y1="510" x2="720" y2="630"/>
    <line x1="740" y1="510" x2="740" y2="630"/>
    <line x1="760" y1="510" x2="760" y2="630"/>
  </g>
  <path d="M 768 620 A 180 180 0 0 1 598 630" fill="none" stroke="#9C9282" stroke-width="1.3" stroke-dasharray="4 4"/>
  <path d="M 616 617 l -18 13 l 22 4 z" fill="#9C9282"/>

  <!-- ===== Cotas ===== -->
  <!-- Cota total 5.40 -->
  <line x1="120" y1="700" x2="768" y2="700" stroke="#8A8578" stroke-width="1"/>
  <line x1="120" y1="693" x2="120" y2="707" stroke="#8A8578" stroke-width="1"/>
  <line x1="768" y1="693" x2="768" y2="707" stroke="#8A8578" stroke-width="1"/>
  <text x="444" y="718" font-size="13" fill="#5A5347" text-anchor="middle">5,40 m (frente entre paredes)</text>

  <!-- Cota zona A -->
  <line x1="120" y1="670" x2="408" y2="670" stroke="#8A8578" stroke-width="1"/>
  <line x1="120" y1="663" x2="120" y2="677" stroke="#8A8578" stroke-width="1"/>
  <line x1="408" y1="663" x2="408" y2="677" stroke="#8A8578" stroke-width="1"/>
  <text x="264" y="663" font-size="12" fill="#5A5347" text-anchor="middle">2,40 m</text>

  <!-- Cota zona B -->
  <line x1="408" y1="670" x2="768" y2="670" stroke="#8A8578" stroke-width="1"/>
  <line x1="408" y1="663" x2="408" y2="677" stroke="#8A8578" stroke-width="1"/>
  <line x1="768" y1="663" x2="768" y2="677" stroke="#8A8578" stroke-width="1"/>
  <text x="588" y="663" font-size="12" fill="#5A5347" text-anchor="middle">3,00 m</text>

  <!-- Cota altura total -->
  <line x1="90" y1="150" x2="90" y2="630" stroke="#8A8578" stroke-width="1"/>
  <line x1="83" y1="150" x2="97" y2="150" stroke="#8A8578" stroke-width="1"/>
  <line x1="83" y1="630" x2="97" y2="630" stroke="#8A8578" stroke-width="1"/>
  <text x="70" y="390" font-size="12" fill="#5A5347" text-anchor="middle" transform="rotate(-90 70 390)">4,00 m (altura bajo)</text>

  <!-- Cota altura puertas (1.00m) -->
  <line x1="800" y1="510" x2="800" y2="630" stroke="#8A8578" stroke-width="1"/>
  <line x1="793" y1="510" x2="807" y2="510" stroke="#8A8578" stroke-width="1"/>
  <line x1="793" y1="630" x2="807" y2="630" stroke="#8A8578" stroke-width="1"/>
  <text x="815" y="575" font-size="11.5" fill="#5A5347">1,00 m</text>

  <!-- Leyenda -->
  <g font-size="12" fill="#5A5347">
    <text x="264" y="798" text-anchor="middle">Machones de anclaje: 0,25–0,30 m (extremos y entre ventanas)</text>
    <text x="588" y="798" text-anchor="middle">2 puertas abatibles de barrotes de aluminio, 1,50 m c/u · abren hacia el interior</text>
  </g>
</svg>
